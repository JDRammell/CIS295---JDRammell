<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="32" height="32">
  <!-- Background -->
  <rect width="100" height="100" rx="12" fill="#1a0533"/>
  
  <!-- Glow behind star -->
  <circle cx="50" cy="50" r="30" fill="#ff69b4" opacity="0.15"/>

  <!-- Main star shape -->
  <polygon 
    points="50,10 61,35 88,35 67,54 75,80 50,63 25,80 33,54 12,35 39,35"
    fill="#ff69b4"
    style="filter: drop-shadow(0 0 6px #ff69b4) drop-shadow(0 0 12px #ff69b4);"
  />

  <!-- Inner star highlight -->
  <polygon 
    points="50,20 58,38 78,38 63,50 69,68 50,57 31,68 37,50 22,38 42,38"
    fill="#ffd700"
    opacity="0.7"
    style="filter: drop-shadow(0 0 4px #ffcc00);"
  />

  <!-- Tiny sparkle top right -->
  <line x1="75" y1="18" x2="75" y2="26" stroke="white" stroke-width="1.5" opacity="0.9"/>
  <line x1="71" y1="22" x2="79" y2="22" stroke="white" stroke-width="1.5" opacity="0.9"/>

  <!-- Tiny sparkle bottom left -->
  <line x1="22" y1="68" x2="22" y2="74" stroke="white" stroke-width="1.5" opacity="0.7"/>
  <line x1="19" y1="71" x2="25" y2="71" stroke="white" stroke-width="1.5" opacity="0.7"/>

  <!-- Tiny sparkle top left -->
  <line x1="28" y1="22" x2="28" y2="27" stroke="#ffd700" stroke-width="1.5" opacity="0.8"/>
  <line x1="25.5" y1="24.5" x2="30.5" y2="24.5" stroke="#ffd700" stroke-width="1.5" opacity="0.8"/>
</svg>
